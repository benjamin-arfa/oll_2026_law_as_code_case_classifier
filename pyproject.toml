[project]
name = "case-classifier"
version = "0.1.0"
description = "Classify legal cases to identify applicable OpenFisca-indexed Swiss laws using syllogistic reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dspy>=3.2.0",
    "httpx>=0.28.1",
    "litellm>=1.82.6",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/case_classifier"]
