article_reference: "OR Art. 41"
law_name: "Code des Obligations — Tort Liability"
legal_text: |
  1 Wer einem andern widerrechtlich Schaden zufügt, sei es mit Absicht,
  sei es aus Fahrlässigkeit, wird ihm zum Ersatze verpflichtet.
  2 Ebenso ist zum Ersatze verpflichtet, wer einem andern in einer
  gegen die guten Sitten verstossenden Weise absichtlich Schaden zufügt.
openfisca_variable: "or_tort_liability"
input_parameters:
  - name: "has_damage"
    type: bool
    description: "Whether the person caused damage to another"
  - name: "has_unlawful_act"
    type: bool
    description: "Whether the act was unlawful"
  - name: "has_intent"
    type: bool
    description: "Whether the person acted with intent"
  - name: "has_negligence"
    type: bool
    description: "Whether the person acted with negligence"
  - name: "has_causation"
    type: bool
    description: "Whether there is an adequate causal link between act and damage"
  - name: "is_contrary_to_morals"
    type: bool
    description: "Whether the act was intentionally against good morals"
keywords:
  - tort
  - liability
  - damage
  - unlawful
  - negligence
